<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Termine">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kundentermine</title>
<style>
  :root {
    --bg: #f4f3ef;
    --card: #ffffff;
    --text: #1b1b1a;
    --muted: #77756f;
    --line: #e4e2dc;
    --accent: #1f5f5b;
    --accent-soft: #dcebe9;
    --danger: #b3372b;
    --warn: #b06a0b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515;
      --card: #222221;
      --text: #f0efea;
      --muted: #9b9991;
      --line: #34332f;
      --accent: #6cc0b8;
      --accent-soft: #1d3634;
      --danger: #ef7a6d;
      --warn: #e5a54b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 24px; }
  h1 { font-size: 32px; letter-spacing: -0.02em; margin: 12px 0 14px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 22px 4px 8px; }
  h2.overdue { color: var(--danger); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .topbar h1 { flex: 1; min-width: 0; }
  .iconbtn { border: 0; background: var(--accent); color: var(--bg); width: 40px; height: 40px;
             border-radius: 50%; font-size: 26px; line-height: 1; display: grid; place-items: center; flex: none; }
  .back { border: 0; background: none; color: var(--accent); padding: 10px 0; font-size: 17px; }

  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px;
         border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.tap { cursor: pointer; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { overflow-wrap: anywhere; }
  .row .meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .meta .late { color: var(--danger); font-weight: 600; }
  .chev { color: var(--muted); font-size: 20px; }
  .badge { background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
           border-radius: 999px; padding: 2px 9px; flex: none; }

  .check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; flex: none; margin: 0;
           border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 7px; height: 12px; border: solid var(--bg);
           border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .done .title { text-decoration: line-through; color: var(--muted); }

  .quickadd { display: flex; gap: 8px; }
  .field, .quickadd input {
    width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 12px 14px; outline: none; font-size: 17px;
  }
  .field:focus, .quickadd input:focus { border-color: var(--accent); }
  .search { margin-bottom: 4px; }

  .empty { color: var(--muted); text-align: center; padding: 28px 16px; }
  .banner { background: var(--accent-soft); color: var(--text); border-radius: var(--radius);
            padding: 12px 14px; margin: 8px 0 4px; display: flex; gap: 10px; align-items: center; font-size: 15px; }
  .banner button { margin-left: auto; flex: none; }

  /* Termin-Detail */
  .detail-head { margin: 4px 0 6px; }
  .detail-head .sub { color: var(--muted); }
  .notes .note { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 14px;
                 border-bottom: 1px solid var(--line); min-height: 48px; }
  .notes .note:last-child { border-bottom: 0; }
  .note .dot { color: var(--muted); flex: none; }
  .note input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 12px 0; font-size: 17px; }
  .totodo { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 8px;
            font-size: 14px; font-weight: 600; padding: 6px 10px; flex: none; }
  .totodo.is-todo { background: none; color: var(--muted); font-weight: 400; }
  .hint { font-size: 14px; color: var(--muted); margin: 6px 4px 0; }

  .actions { display: grid; gap: 10px; margin-top: 22px; }
  .btn { border: 0; border-radius: 12px; padding: 14px; font-weight: 600; background: var(--card); color: var(--accent);
         width: 100%; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.danger { color: var(--danger); }
  .btn.small { width: auto; padding: 8px 12px; font-size: 15px; }

  /* Tab-Leiste */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
             background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px);
             -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
             padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav.tabs a { flex: 1; max-width: 200px; text-align: center; padding: 8px 0 10px; color: var(--muted);
               text-decoration: none; font-size: 12px; font-weight: 500; }
  nav.tabs a .ico { display: block; font-size: 22px; line-height: 1.3; }
  nav.tabs a.active { color: var(--accent); }

  /* Bottom-Sheet */
  dialog { border: 0; padding: 0; width: 100%; max-width: 640px; margin: auto auto 0; background: var(--bg);
           color: var(--text); border-radius: 18px 18px 0 0; max-height: 92vh; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .sheet { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head strong { font-size: 17px; }
  .sheet-head button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 6px 0; }
  .sheet-head .save { font-weight: 600; }
  label.lbl { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  textarea.field { min-height: 80px; resize: vertical; }
  .linkrow { color: var(--accent); background: var(--card); border-radius: 12px; padding: 12px 14px; border: 0; text-align: left; }

  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 15px;
           opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .info { font-size: 15px; color: var(--muted); padding: 12px 14px; }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs">
  <a href="#/todos" data-tab="todos"><span class="ico">☑︎</span>Todos</a>
  <a href="#/termine" data-tab="termine"><span class="ico">◷</span>Termine</a>
  <a href="#/mehr" data-tab="mehr"><span class="ico">⋯</span>Mehr</a>
</nav>

<dialog id="sheet"></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";

/* ---------- Daten ---------- */
const KEY = "kundentermine-v1";
const BACKUP_KEY = "kundentermine-lastBackup";
let db = load();

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.termine) && Array.isArray(d.todos)) return d;
  } catch (e) {}
  return { termine: [], todos: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Speichern fehlgeschlagen!"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const termin = id => db.termine.find(t => t.id === id);
const todo = id => db.todos.find(t => t.id === id);

/* ---------- Hilfen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowLocal = () => { const d = new Date(); d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseLocal = s => { if (!s) return null; const [d, t = "00:00"] = s.split("T"); const [y, m, da] = d.split("-").map(Number);
  const [h, mi] = t.split(":").map(Number); return new Date(y, m - 1, da, h, mi); };
function fmtDateTime(s) {
  const d = parseLocal(s); if (!d) return "";
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" }) +
         ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
}
function fmtDate(s) {
  if (!s) return "";
  const t = todayStr();
  if (s === t) return "heute";
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  if (s === `${tm.getFullYear()}-${pad(tm.getMonth() + 1)}-${pad(tm.getDate())}`) return "morgen";
  return parseLocal(s).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

/* ---------- Routing ---------- */
function route() {
  const [, view = "todos", id] = location.hash.split("/");
  document.querySelectorAll("nav.tabs a").forEach(a =>
    a.classList.toggle("active", a.dataset.tab === (view === "termin" ? "termine" : view)));
  const app = document.getElementById("app");
  if (view === "termin" && termin(id)) renderTermin(app, id);
  else if (view === "termine") renderTermine(app);
  else if (view === "mehr") renderMehr(app);
  else renderTodos(app);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ---------- Ansicht: Todos ---------- */
let showDone = false;
function todoRow(t, withKunde = true) {
  const tm = t.terminId && termin(t.terminId);
  const late = t.faellig && !t.erledigt && t.faellig < todayStr();
  const meta = [
    withKunde && tm ? esc(tm.kunde) : "",
    t.faellig ? `<span class="${late ? "late" : ""}">${late ? "überfällig · " : "bis "}${esc(fmtDate(t.faellig))}</span>` : ""
  ].filter(Boolean).join(" · ");
  return `<div class="row ${t.erledigt ? "done" : ""}">
    <input type="checkbox" class="check" data-toggle="${t.id}" ${t.erledigt ? "checked" : ""} aria-label="Erledigt">
    <div class="body tap" data-edit-todo="${t.id}">
      <div class="title">${esc(t.text)}</div>${meta ? `<div class="meta">${meta}</div>` : ""}
    </div></div>`;
}
function renderTodos(app) {
  const open = db.todos.filter(t => !t.erledigt);
  const done = db.todos.filter(t => t.erledigt).sort((a, b) => (b.erledigtAm || 0) - (a.erledigtAm || 0));
  const today = todayStr();
  const byDate = (a, b) => (a.faellig || "9").localeCompare(b.faellig || "9") || a.erstellt - b.erstellt;
  const groups = [
    ["Überfällig", open.filter(t => t.faellig && t.faellig < today), "overdue"],
    ["Heute", open.filter(t => t.faellig === today)],
    ["Demnächst", open.filter(t => t.faellig && t.faellig > today)],
    ["Ohne Datum", open.filter(t => !t.faellig)],
  ];
  let html = `<div class="topbar"><h1>Meine Todos</h1></div>`;
  html += backupBanner();
  html += `<form class="quickadd" id="quickadd"><input id="quickText" placeholder="Neues Todo …" enterkeyhint="done" autocomplete="off"></form>`;
  for (const [name, list, cls] of groups) {
    if (!list.length) continue;
    html += `<h2 class="${cls || ""}">${name} · ${list.length}</h2><div class="card">${list.sort(byDate).map(t => todoRow(t)).join("")}</div>`;
  }
  if (!open.length) html += `<div class="empty">Keine offenen Todos 🎉</div>`;
  if (done.length) {
    html += `<h2>Erledigt · ${done.length} <button class="btn small" id="toggleDone" style="margin-left:8px">${showDone ? "ausblenden" : "anzeigen"}</button></h2>`;
    if (showDone) html += `<div class="card">${done.map(t => todoRow(t)).join("")}</div>`;
  }
  app.innerHTML = html;
  app.querySelector("#quickadd").onsubmit = e => {
    e.preventDefault();
    const inp = app.querySelector("#quickText"), text = inp.value.trim();
    if (!text) return;
    db.todos.push({ id: uid(), text, faellig: "", erledigt: false, terminId: null, erstellt: Date.now() });
    save(); route(); document.getElementById("quickText").focus();
  };
  const tg = app.querySelector("#toggleDone");
  if (tg) tg.onclick = () => { showDone = !showDone; route(); };
}

/* ---------- Ansicht: Termine ---------- */
let search = "";
function renderTermine(app) {
  const q = search.toLowerCase();
  const list = db.termine.filter(t => !q || t.kunde.toLowerCase().includes(q) || (t.ort || "").toLowerCase().includes(q));
  const upcoming = list.filter(t => parseLocal(t.datum) >= startOfToday()).sort((a, b) => a.datum.localeCompare(b.datum));
  const past = list.filter(t => parseLocal(t.datum) < startOfToday()).sort((a, b) => b.datum.localeCompare(a.datum));
  const row = t => {
    const n = db.todos.filter(x => x.terminId === t.id && !x.erledigt).length;
    return `<div class="row tap" data-open="${t.id}"><div class="body">
      <div class="title">${esc(t.kunde)}</div>
      <div class="meta">${esc(fmtDateTime(t.datum))}${t.ort ? " · " + esc(t.ort) : ""}</div></div>
      ${n ? `<span class="badge">${n} offen</span>` : ""}<span class="chev">›</span></div>`;
  };
  let html = `<div class="topbar"><h1>Termine</h1><button class="iconbtn" id="newTermin" aria-label="Neuer Termin">+</button></div>
    <input class="field search" id="search" type="search" placeholder="Kunde oder Ort suchen" value="${esc(search)}">`;
  if (upcoming.length) html += `<h2>Heute & anstehend</h2><div class="card">${upcoming.map(row).join("")}</div>`;
  if (past.length) html += `<h2>Vergangen</h2><div class="card">${past.map(row).join("")}</div>`;
  if (!list.length) html += `<div class="empty">${q ? "Nichts gefunden." : "Noch keine Termine. Tippe auf +, um den ersten Kundentermin anzulegen."}</div>`;
  app.innerHTML = html;
  app.querySelector("#newTermin").onclick = () => terminSheet();
  const s = app.querySelector("#search");
  s.oninput = () => { search = s.value; const pos = s.selectionStart; route(); const n = document.getElementById("search"); n.focus(); n.setSelectionRange(pos, pos); };
}
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

/* ---------- Ansicht: Termin-Detail ---------- */
function renderTermin(app, id) {
  const t = termin(id);
  const todos = db.todos.filter(x => x.terminId === id).sort((a, b) => a.erledigt - b.erledigt || a.erstellt - b.erstellt);
  if (!t.notizen.length) t.notizen.push({ id: uid(), text: "" });
  app.innerHTML = `
    <button class="back" onclick="location.hash='#/termine'">‹ Termine</button>
    <div class="topbar detail-head"><h1>${esc(t.kunde)}</h1><button class="btn small" id="editTermin">Bearbeiten</button></div>
    <div class="sub detail-head">${esc(fmtDateTime(t.datum))}${t.ort ? "<br>" + esc(t.ort) : ""}</div>
    <h2>Stichpunkte</h2>
    <div class="card notes" id="notes">${t.notizen.map(noteRow).join("")}</div>
    <p class="hint">Return = neuer Stichpunkt · „→ Todo“ übernimmt ihn in deine Todo-Liste</p>
    <h2>Todos aus diesem Termin</h2>
    <div class="card" id="terminTodos">${todos.map(x => todoRow(x, false)).join("") || `<div class="info">Noch keine Todos.</div>`}</div>
    <div class="actions">
      <button class="btn" id="addTodo">+ Todo hinzufügen</button>
      <button class="btn primary" id="shareTermin">Termin teilen (Mail, Notizen …)</button>
      <button class="btn" id="icsTermin">In Kalender übernehmen</button>
      <button class="btn danger" id="delTermin">Termin löschen</button>
    </div>`;
  app.querySelector("#editTermin").onclick = () => terminSheet(t);
  app.querySelector("#addTodo").onclick = () => todoSheet(null, id);
  app.querySelector("#shareTermin").onclick = () => shareText(`Termin ${t.kunde}`, terminText(t));
  app.querySelector("#icsTermin").onclick = () => shareFile(new Blob([ics(t)], { type: "text/calendar" }), `Termin-${slug(t.kunde)}.ics`);
  app.querySelector("#delTermin").onclick = () => {
    const n = db.todos.filter(x => x.terminId === id).length;
    if (!confirm(`Termin „${t.kunde}“ löschen?` + (n ? `\n${n} zugehörige Todos bleiben erhalten.` : ""))) return;
    db.termine = db.termine.filter(x => x.id !== id);
    db.todos.forEach(x => { if (x.terminId === id) x.terminId = null; });
    save(); location.hash = "#/termine";
  };
  wireNotes(app.querySelector("#notes"), t);
}
function noteRow(n) {
  const isTodo = n.todoId && todo(n.todoId);
  return `<div class="note" data-note="${n.id}"><span class="dot">•</span>
    <input value="${esc(n.text)}" placeholder="Stichpunkt …" enterkeyhint="next" autocomplete="off" autocapitalize="sentences">
    <button class="totodo ${isTodo ? "is-todo" : ""}" data-totodo="${n.id}">${isTodo ? "✓ Todo" : "→ Todo"}</button></div>`;
}
function wireNotes(box, t) {
  const idx = el => t.notizen.findIndex(n => n.id === el.closest(".note").dataset.note);
  box.addEventListener("input", e => { const i = idx(e.target); t.notizen[i].text = e.target.value; save(); });
  box.addEventListener("keydown", e => {
    if (e.target.tagName !== "INPUT") return;
    const i = idx(e.target);
    if (e.key === "Enter") {
      e.preventDefault();
      const n = { id: uid(), text: "" };
      t.notizen.splice(i + 1, 0, n); save();
      e.target.closest(".note").insertAdjacentHTML("afterend", noteRow(n));
      box.querySelector(`[data-note="${n.id}"] input`).focus();
    } else if (e.key === "Backspace" && e.target.value === "" && t.notizen.length > 1) {
      e.preventDefault();
      const prev = e.target.closest(".note").previousElementSibling || e.target.closest(".note").nextElementSibling;
      t.notizen.splice(i, 1); save();
      e.target.closest(".note").remove();
      const pi = prev.querySelector("input"); pi.focus(); pi.setSelectionRange(pi.value.length, pi.value.length);
    }
  });
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-totodo]"); if (!b) return;
    const n = t.notizen.find(x => x.id === b.dataset.totodo);
    if (n.todoId && todo(n.todoId)) { todoSheet(todo(n.todoId)); return; }
    if (!n.text.trim()) { toast("Erst Stichpunkt eintippen"); return; }
    const td = { id: uid(), text: n.text.trim(), faellig: "", erledigt: false, terminId: t.id, erstellt: Date.now() };
    db.todos.push(td); n.todoId = td.id; save();
    toast("Als Todo übernommen"); route();
  });
}

/* ---------- Ansicht: Mehr ---------- */
function renderMehr(app) {
  const last = localStorage.getItem(BACKUP_KEY);
  const open = db.todos.filter(t => !t.erledigt).length;
  app.innerHTML = `<h1>Mehr</h1>
    <h2>Mitnehmen</h2>
    <div class="actions" style="margin-top:0">
      <button class="btn primary" id="shareOpen">Alle offenen Todos teilen (${open})</button>
    </div>
    <h2>Datensicherung</h2>
    <div class="card"><div class="info">Deine Daten liegen nur auf diesem iPhone. Sichere sie regelmäßig, z. B. in „Dateien“ oder per Mail an dich.<br>
      Letzte Sicherung: <strong>${last ? new Date(+last).toLocaleDateString("de-DE") : "noch nie"}</strong></div></div>
    <div class="actions">
      <button class="btn primary" id="backup">Backup erstellen</button>
      <button class="btn" id="restore">Backup wiederherstellen</button>
    </div>
    <h2>Installation</h2>
    <div class="card"><div class="info">In Safari auf <strong>Teilen</strong> → <strong>„Zum Home-Bildschirm“</strong> tippen. Starte die App immer über das Icon, nicht über einen Safari-Tab.</div></div>
    <h2>Statistik</h2>
    <div class="card"><div class="info">${db.termine.length} Termine · ${db.todos.length} Todos (${open} offen)</div></div>
    <div class="actions"><button class="btn danger" id="wipe">Alle Daten löschen</button></div>`;
  app.querySelector("#shareOpen").onclick = () => shareText("Offene Todos", openTodosText());
  app.querySelector("#backup").onclick = doBackup;
  app.querySelector("#restore").onclick = () => document.getElementById("importFile").click();
  app.querySelector("#wipe").onclick = () => {
    if (!confirm("Wirklich ALLE Termine und Todos löschen? Das kann nicht rückgängig gemacht werden.")) return;
    db = { termine: [], todos: [] }; save(); route(); toast("Alle Daten gelöscht");
  };
}
function backupBanner() {
  if (!db.termine.length && !db.todos.length) return "";
  const last = +localStorage.getItem(BACKUP_KEY) || 0;
  if (Date.now() - last < 14 * 864e5) return "";
  return `<div class="banner">💾 ${last ? "Letzte Sicherung ist über 14 Tage her." : "Noch keine Datensicherung."}
    <button class="btn small" onclick="doBackup()">Sichern</button></div>`;
}
async function doBackup() {
  const blob = new Blob([JSON.stringify({ app: "kundentermine", version: 1, exportiert: new Date().toISOString(), ...db }, null, 2)], { type: "application/json" });
  const ok = await shareFile(blob, `Kundentermine-Backup-${todayStr()}.json`);
  if (ok) { localStorage.setItem(BACKUP_KEY, Date.now()); route(); }
}
document.getElementById("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.termine) || !Array.isArray(d.todos)) throw new Error();
    if (!confirm(`Backup vom ${d.exportiert ? new Date(d.exportiert).toLocaleDateString("de-DE") : "?"} laden?\n${d.termine.length} Termine, ${d.todos.length} Todos.\nDie aktuellen Daten werden ersetzt.`)) return;
    db = { termine: d.termine, todos: d.todos }; save(); route(); toast("Backup wiederhergestellt");
  } catch (err) { toast("Keine gültige Backup-Datei"); }
};

/* ---------- Teilen / Export ---------- */
function terminText(t) {
  const notes = t.notizen.filter(n => n.text.trim());
  const todos = db.todos.filter(x => x.terminId === t.id);
  let s = `Kundentermin: ${t.kunde}\n${fmtDateTime(t.datum)}${t.ort ? "\n" + t.ort : ""}\n`;
  if (notes.length) s += `\nStichpunkte:\n${notes.map(n => "• " + n.text.trim()).join("\n")}\n`;
  if (todos.length) s += `\nTodos:\n${todos.map(x => `${x.erledigt ? "☑" : "☐"} ${x.text}${x.faellig ? ` (bis ${fmtDate(x.faellig)})` : ""}`).join("\n")}\n`;
  return s;
}
function openTodosText() {
  const open = db.todos.filter(t => !t.erledigt).sort((a, b) => (a.faellig || "9").localeCompare(b.faellig || "9"));
  const groups = new Map();
  for (const t of open) { const k = (t.terminId && termin(t.terminId)?.kunde) || "Allgemein"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  let s = `Offene Todos (Stand ${new Date().toLocaleDateString("de-DE")})\n`;
  for (const [k, list] of groups) s += `\n${k}:\n${list.map(t => `☐ ${t.text}${t.faellig ? ` (bis ${fmtDate(t.faellig)})` : ""}`).join("\n")}\n`;
  return s;
}
async function shareText(title, text) {
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); }
  catch (e) { toast("Teilen nicht möglich"); }
}
async function shareFile(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
const slug = s => s.replace(/[^\wäöüÄÖÜß-]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "Termin";
function ics(t) {
  const e = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const d = parseLocal(t.datum);
  const f = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const end = new Date(d.getTime() + 60 * 60000);
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const desc = t.notizen.filter(n => n.text.trim()).map(n => "• " + n.text.trim()).join("\n");
  // Zeilen nach max. 73 Byte (UTF-8) falten, ohne Zeichen zu zerteilen
  const enc = new TextEncoder();
  const fold = line => { let out = "", cur = "", n = 0;
    for (const ch of line) { const b = enc.encode(ch).length;
      if (n + b > 73) { out += cur + "\r\n "; cur = ""; n = 1; }
      cur += ch; n += b; }
    return out + cur; };
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Kundentermine//DE", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${t.id}@kundentermine`, `DTSTAMP:${now}`, `DTSTART:${f(d)}`, `DTEND:${f(end)}`,
    `SUMMARY:${e("Kundentermin: " + t.kunde)}`, t.ort ? `LOCATION:${e(t.ort)}` : "",
    desc ? `DESCRIPTION:${e(desc)}` : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).map(fold).join("\r\n") + "\r\n";
}

/* ---------- Sheets (Formulare) ---------- */
const sheet = document.getElementById("sheet");
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
function openSheet(html, onSave) {
  sheet.innerHTML = `<form class="sheet" method="dialog">${html}</form>`;
  const form = sheet.querySelector("form");
  form.querySelector("[data-cancel]").onclick = () => sheet.close();
  form.onsubmit = e => { e.preventDefault(); if (onSave(form) !== false) sheet.close(); };
  sheet.showModal();
  return form;
}
function terminSheet(t) {
  const form = openSheet(`
    <div class="sheet-head"><button type="button" data-cancel>Abbrechen</button><strong>${t ? "Termin bearbeiten" : "Neuer Termin"}</strong><button class="save">Sichern</button></div>
    <label class="lbl">Kunde<input class="field" name="kunde" required value="${esc(t?.kunde)}" autocomplete="off" autocapitalize="words"></label>
    <label class="lbl">Datum & Uhrzeit<input class="field" name="datum" type="datetime-local" required value="${esc(t?.datum || nowLocal())}"></label>
    <label class="lbl">Ort / Ansprechpartner (optional)<input class="field" name="ort" value="${esc(t?.ort)}" autocomplete="off"></label>`,
    f => {
      const v = { kunde: f.kunde.value.trim(), datum: f.datum.value, ort: f.ort.value.trim() };
      if (!v.kunde || !v.datum) return false;
      if (t) { Object.assign(t, v); save(); route(); }
      else { const n = { id: uid(), ...v, notizen: [{ id: uid(), text: "" }], erstellt: Date.now() };
        db.termine.push(n); save(); location.hash = `#/termin/${n.id}`;
        setTimeout(() => document.querySelector("#notes input")?.focus(), 50); }
    });
  if (!t) form.kunde.focus();
}
function todoSheet(t, terminId) {
  const tm = termin(t?.terminId || terminId);
  const form = openSheet(`
    <div class="sheet-head"><button type="button" data-cancel>Abbrechen</button><strong>${t ? "Todo" : "Neues Todo"}</strong><button class="save">Sichern</button></div>
    <label class="lbl">Was ist zu tun?<textarea class="field" name="text" required>${esc(t?.text)}</textarea></label>
    <label class="lbl">Fällig am (optional)<input class="field" name="faellig" type="date" value="${esc(t?.faellig)}"></label>
    ${tm ? `<button type="button" class="linkrow" data-goto>Kunde: ${esc(tm.kunde)} · ${esc(fmtDate(tm.datum.slice(0, 10)))} ›</button>` : ""}
    ${t ? `<button type="button" class="btn danger" data-del>Todo löschen</button>` : ""}`,
    f => {
      const v = { text: f.text.value.trim(), faellig: f.faellig.value };
      if (!v.text) return false;
      if (t) Object.assign(t, v);
      else db.todos.push({ id: uid(), ...v, erledigt: false, terminId: terminId || null, erstellt: Date.now() });
      save(); route();
    });
  form.querySelector("[data-goto]")?.addEventListener("click", () => { sheet.close(); location.hash = `#/termin/${tm.id}`; });
  form.querySelector("[data-del]")?.addEventListener("click", () => {
    db.todos = db.todos.filter(x => x.id !== t.id); save(); sheet.close(); route(); toast("Todo gelöscht");
  });
  if (!t) form.text.focus();
}

/* ---------- Globale Klicks ---------- */
document.getElementById("app").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { location.hash = `#/termin/${open.dataset.open}`; return; }
  const ed = e.target.closest("[data-edit-todo]");
  if (ed) { todoSheet(todo(ed.dataset.editTodo)); return; }
});
document.getElementById("app").addEventListener("change", e => {
  const id = e.target.dataset.toggle; if (!id) return;
  const t = todo(id); t.erledigt = e.target.checked; t.erledigtAm = t.erledigt ? Date.now() : null; save();
  if (t.erledigt) toast("Erledigt ✓");
  setTimeout(route, t.erledigt ? 350 : 0);
});

/* Daten aus anderem Tab/Fenster übernehmen */
window.addEventListener("storage", e => { if (e.key === KEY) { db = load(); route(); } });

route();
</script>
