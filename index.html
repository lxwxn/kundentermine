<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Termine">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kundentermine</title>
<style>
  :root {
    --bg: #f4f3ef;
    --card: #ffffff;
    --text: #1b1b1a;
    --muted: #77756f;
    --line: #e4e2dc;
    --accent: #1f5f5b;
    --accent-soft: #dcebe9;
    --danger: #b3372b;
    --warn: #9a5a00;
    --warn-soft: #f6e8d2;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515;
      --card: #222221;
      --text: #f0efea;
      --muted: #9b9991;
      --line: #34332f;
      --accent: #6cc0b8;
      --accent-soft: #1d3634;
      --danger: #ef7a6d;
      --warn: #e5a54b;
      --warn-soft: #3a2c17;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 24px; }
  h1 { font-size: 32px; letter-spacing: -0.02em; margin: 12px 0 14px; overflow-wrap: anywhere; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 22px 4px 8px; display: flex; align-items: center; gap: 8px; min-height: 30px; }
  h2 .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h2.overdue { color: var(--danger); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .topbar h1 { flex: 1; min-width: 0; }
  .iconbtn { border: 0; background: var(--accent); color: var(--bg); width: 40px; height: 40px;
             border-radius: 50%; font-size: 26px; line-height: 1; display: grid; place-items: center; flex: none; }
  .back { border: 0; background: none; color: var(--accent); padding: 10px 0; font-size: 17px; }

  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px;
         border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .tap { cursor: pointer; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { overflow-wrap: anywhere; }
  .row .meta { font-size: 14px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .meta .late { color: var(--danger); font-weight: 600; }
  .meta .who { color: var(--accent); font-weight: 600; }
  .meta .stale { color: var(--warn); font-weight: 600; }
  .row .ask { background: var(--accent-soft); }
  .banner.warn { background: var(--warn-soft); }
  .row .result { font-size: 14px; margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--accent); overflow-wrap: anywhere; }
  .chev { color: var(--muted); font-size: 20px; }
  .badge { background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
           border-radius: 999px; padding: 2px 9px; flex: none; white-space: nowrap; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }

  .check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; flex: none; margin: 0;
           border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
  .check.half { border-color: var(--accent); }
  .check.half::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 7px; height: 12px; border-radius: 0; background: none; border: solid var(--bg);
           border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .done .title { text-decoration: line-through; color: var(--muted); }

  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; gap: 3px; margin: 4px 0 12px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px 2px; border-radius: 9px; font-size: 15px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--bg); font-weight: 600; }
  .seg .n { font-size: 12px; opacity: .8; margin-left: 3px; }

  .quickadd { display: flex; gap: 8px; }
  .field, .quickadd input {
    width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 12px 14px; outline: none; font-size: 17px;
  }
  .field:focus, .quickadd input:focus { border-color: var(--accent); }
  input[type="datetime-local"].field, input[type="date"].field { min-height: 50px; -webkit-appearance: none; }
  .search { margin-bottom: 4px; }

  .empty { color: var(--muted); text-align: center; padding: 28px 16px; }
  .banner { background: var(--accent-soft); color: var(--text); border-radius: var(--radius);
            padding: 12px 14px; margin: 8px 0 12px; display: flex; gap: 10px; align-items: center; font-size: 15px; }
  .banner button { margin-left: auto; flex: none; }

  /* Termin-Detail */
  .detail-head { margin: 4px 0 6px; }
  .detail-head .sub { color: var(--muted); }
  .togglerow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .notes .note { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 14px;
                 border-bottom: 1px solid var(--line); min-height: 48px; }
  .notes .note:last-child { border-bottom: 0; }
  .note .dot { color: var(--muted); flex: none; width: 10px; }
  .note input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 12px 0; font-size: 17px; }
  .note.is-h { background: var(--accent-soft); }
  .note.is-h input { font-weight: 700; }
  .note.is-h .dot { visibility: hidden; }
  .note.is-h .totodo { visibility: hidden; }
  .totodo { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 8px;
            font-size: 14px; font-weight: 600; padding: 6px 10px; flex: none; }
  .totodo.is-todo { background: none; color: var(--muted); font-weight: 400; }
  .hint { font-size: 14px; color: var(--muted); margin: 6px 4px 0; }

  .actions { display: grid; gap: 10px; margin-top: 22px; }
  .btn { border: 0; border-radius: 12px; padding: 14px; font-weight: 600; background: var(--card); color: var(--accent);
         width: 100%; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.danger { color: var(--danger); }
  .btn.small { width: auto; padding: 6px 12px; font-size: 14px; text-transform: none; letter-spacing: 0; flex: none; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .btn { flex: 1; }
  .btnrow .btn.small.fit { flex: none; padding: 0 16px; }

  /* Tab-Leiste */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
             background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px);
             -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
             padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav.tabs a { flex: 1; max-width: 200px; text-align: center; padding: 8px 0 10px; color: var(--muted);
               text-decoration: none; font-size: 12px; font-weight: 500; }
  nav.tabs a .ico { display: block; font-size: 22px; line-height: 1.3; }
  nav.tabs a.active { color: var(--accent); }

  /* Bottom-Sheet */
  dialog { border: 0; padding: 0; width: 100%; max-width: 640px; margin: auto auto 0; background: var(--bg);
           color: var(--text); border-radius: 18px 18px 0 0; max-height: 92vh; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .sheet { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sheet-head strong { font-size: 17px; text-align: center; }
  .sheet-head button { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 6px 0; }
  .sheet-head .save { font-weight: 600; }
  label.lbl { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  label.chk { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 12px 14px; }
  textarea.field { min-height: 80px; resize: vertical; }
  textarea.report { min-height: 50vh; font-size: 15px; line-height: 1.45; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .linkrow { color: var(--accent); background: var(--card); border-radius: 12px; padding: 12px 14px; border: 0; text-align: left; }
  details.invite { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
  details.invite summary { color: var(--accent); font-weight: 600; cursor: pointer; }
  details.invite[open] summary { margin-bottom: 10px; }
  details.invite .field { background: var(--card); font-size: 15px; }
  details.invite .btnrow { margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 15px;
           opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .info { font-size: 15px; color: var(--muted); padding: 12px 14px; }

  /* Aufgaben */
  .star { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 6px 2px; flex: none; }
  .star.on { color: var(--warn); }
  .preview { font-size: 14px; color: var(--accent); font-weight: 600; margin: 6px 4px 0; overflow-wrap: anywhere; }
  .preview.tip { color: var(--muted); font-weight: 400; }
  .preview:empty { display: none; }
  #aufgabenSuche { margin-top: 10px; }
  .seg.mini { margin-top: -4px; }
  .seg.mini button { font-size: 13px; padding: 5px 2px; }
  .quickdates { display: flex; gap: 6px; flex-wrap: wrap; margin-top: -4px; }
  .quickdates .btn.small { color: var(--accent); }
  .kunden .row { gap: 8px; padding: 4px 8px 4px 14px; min-height: 48px; }
  .kunden input { border: 0; background: none; outline: none; font-size: 16px; padding: 8px 0; min-width: 0; }
  .kunden .k-nr { flex: 0 0 34%; font-variant-numeric: tabular-nums; }
  .kunden .k-name { flex: 1; }
  .kunden .newk { background: var(--accent-soft); }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs">
  <a href="#/aufgaben" data-tab="aufgaben"><span class="ico">☑︎</span>Aufgaben</a>
  <a href="#/termine" data-tab="termine"><span class="ico">◷</span>Termine</a>
  <a href="#/mehr" data-tab="mehr"><span class="ico">⋯</span>Mehr</a>
</nav>

<dialog id="sheet"></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="icsFile" accept=".ics,text/calendar" hidden>

<script>
"use strict";

/* ---------- Daten ---------- */
const KEY = "kundentermine-v1";
const BACKUP_KEY = "kundentermine-lastBackup";
const TAB_KEY = "kundentermine-todoTab";
const GRUPPE_KEY = "kundentermine-ichGruppe";
let db; // wird unten nach den Hilfsfunktionen geladen

const VORLAGE_STANDARD = "Ausgangslage\nAnforderungen\nAngebot / Preise\nNächste Schritte";
function migrate(d) {
  d.einstellungen = Object.assign({ name: "", vorlage: VORLAGE_STANDARD, vorlageAuto: false }, d.einstellungen);
  // Kundenstamm: nur ausdrücklich eingetragene Paare aus Kundennr. und Name
  d.kunden = (Array.isArray(d.kunden) ? d.kunden : [])
    .map(k => ({ nr: String(k?.nr ?? "").trim(), name: String(k?.name ?? "").trim() })).filter(k => k.nr);
  for (const t of d.termine) {
    t.kundeNr = t.kundeNr || "";
    t.notizen = t.notizen || [];
    t.teilnehmer = t.teilnehmer || "";
    t.ort = t.ort || "";
    if (!t.ende) t.ende = addHours(t.datum, 3);
    t.berichtErledigt = !!t.berichtErledigt;
  }
  for (const t of d.todos) {
    t.wer = t.wer || "";
    t.ergebnis = t.ergebnis || "";
    t.rueckmeldung = !!t.rueckmeldung;
    t.geklaert = !!t.geklaert;
    t.angefragtAm = t.angefragtAm || ""; // zuletzt angefragt/nachgehakt (YYYY-MM-DD)
    t.kunde = t.kunde || "";       // leer = vom Termin bzw. Kundenstamm übernehmen
    t.kundeNr = t.kundeNr || "";
    t.wichtig = !!t.wichtig;
  }
  return d;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.termine) && Array.isArray(d.todos)) return migrate(d);
  } catch (e) {}
  return migrate({ termine: [], todos: [] });
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Speichern fehlgeschlagen!"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const termin = id => db.termine.find(t => t.id === id);
const todo = id => db.todos.find(t => t.id === id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- Hilfen ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localStr = d => `${dateStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => dateStr(new Date());
const nowLocal = () => { const d = new Date(); d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0); return localStr(d); };
const parseLocal = s => { if (!s) return null; const [d, t = "00:00"] = s.split("T"); const [y, m, da] = d.split("-").map(Number);
  const [h, mi] = t.split(":").map(Number); return new Date(y, m - 1, da, h, mi); };
const addHours = (s, h) => { const d = parseLocal(s); if (!d) return ""; d.setHours(d.getHours() + h); return localStr(d); };
const fmtTime = d => d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const fmtDay = d => d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
function fmtRange(start, end) {
  const a = parseLocal(start), b = parseLocal(end); if (!a) return "";
  if (!b) return `${fmtDay(a)}, ${fmtTime(a)} Uhr`;
  if (dateStr(a) === dateStr(b)) return `${fmtDay(a)}, ${fmtTime(a)}–${fmtTime(b)} Uhr`;
  return `${fmtDay(a)}, ${fmtTime(a)} – ${fmtDay(b)}, ${fmtTime(b)} Uhr`;
}
function fmtDate(s) {
  if (!s) return "";
  if (s === todayStr()) return "heute";
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  if (s === dateStr(tm)) return "morgen";
  return parseLocal(s).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}
const meName = () => db.einstellungen.name.trim() || "ich";
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ---------- Status-Logik ---------- */
// Ein Todo mit „Rückmeldung an Kunden“ hat zwei Schritte: geklärt → Kunde informiert (= erledigt).
const isRueck = t => !t.erledigt && t.rueckmeldung && t.geklaert;
const isKlaeren = t => !t.erledigt && !isRueck(t) && t.wer.trim();
const isIch = t => !t.erledigt && !isRueck(t) && !t.wer.trim();
const berichtOffen = t => !t.berichtErledigt && parseLocal(t.datum) < new Date();
const byDue = (a, b) => (a.faellig || "9").localeCompare(b.faellig || "9") || a.erstellt - b.erstellt;
// Nachfassen: Tage seit der letzten Anfrage; ab NACHFASSEN_TAGE wird markiert
const NACHFASSEN_TAGE = 7;
const daysSince = s => s ? Math.round((new Date(new Date().toDateString()) - parseLocal(s)) / 864e5) : null;
const wartet = t => !t.erledigt && !t.geklaert && t.wer.trim();
const stale = t => wartet(t) && t.angefragtAm && daysSince(t.angefragtAm) >= NACHFASSEN_TAGE;
// Klären-Reihenfolge: noch nicht angefragt → am längsten wartend → Rest
const byKlaeren = (a, b) => (!!a.angefragtAm - !!b.angefragtAm) || (a.angefragtAm || "").localeCompare(b.angefragtAm || "") || byDue(a, b);
const fmtSince = s => { const d = daysSince(s); return d <= 0 ? "heute angefragt" : d === 1 ? "gestern angefragt" : `angefragt vor ${d} Tagen`; };
const byPrio = (a, b) => (b.wichtig - a.wichtig) || byDue(a, b);

/* ---------- Kunden ---------- */
const lc = s => String(s ?? "").trim().toLowerCase();
const kundeByNr = nr => lc(nr) ? db.kunden.find(k => lc(k.nr) === lc(nr)) : null;
const kundeByName = name => lc(name) ? db.kunden.find(k => lc(k.name) === lc(name)) : null;
// Paar aus Nr. und Name im Kundenstamm merken; overwrite=false lässt einen vorhandenen Namen stehen
function merkeKunde(nr, name, overwrite = true) {
  nr = String(nr ?? "").trim(); name = String(name ?? "").trim();
  if (!nr || !name) return;
  const k = kundeByNr(nr);
  if (k) { if (overwrite || !k.name) k.name = name; }
  else db.kunden.push({ nr, name });
  db.kunden.sort((a, b) => a.nr.localeCompare(b.nr, "de", { numeric: true }));
}
// Kunde einer Aufgabe: eigene Angaben zuerst, sonst live vom verknüpften Termin
function kundeInfo(t) {
  const nr = t.kundeNr.trim(), name = t.kunde.trim();
  if (nr || name) return { nr, name: name || kundeByNr(nr)?.name || "" };
  const tm = t.terminId && termin(t.terminId);
  if (!tm) return { nr: "", name: "" };
  const tnr = (tm.kundeNr || "").trim();
  return { nr: tnr, name: kundeByNr(tnr)?.name || tm.kunde || "" };
}
const kundeText = k => [k.nr, k.name].filter(Boolean).join(" · ");
const hatKunde = t => !!kundeText(kundeInfo(t));
const kundeLabel = t => kundeText(kundeInfo(t)) || "Ohne Kunde";
const kundeKey = t => { const k = kundeInfo(t); return k.nr ? "#" + lc(k.nr) : lc(k.name); };
const kundenOptions = () => db.kunden.map(k => `<option value="${esc(k.nr)}">${esc(k.name)}</option>`).join("");
const kundenNamenOptions = () => db.kunden.filter(k => k.name).map(k => `<option value="${esc(k.name)}">${esc(k.nr)}</option>`).join("");

/* ---------- Routing ---------- */
function route() {
  let [, view = "aufgaben", id] = location.hash.split("/");
  if (view === "todos") view = "aufgaben"; // alte Links
  document.querySelectorAll("nav.tabs a").forEach(a =>
    a.classList.toggle("active", a.dataset.tab === (view === "termin" ? "termine" : view)));
  const app = document.getElementById("app");
  if (view === "termin" && termin(id)) renderTermin(app, id);
  else if (view === "termine") renderTermine(app);
  else if (view === "mehr") renderMehr(app);
  else renderAufgaben(app);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ---------- Ansicht: Aufgaben ---------- */
let showDone = false;
let todoTab = store.get(TAB_KEY) || "ich";
let ichGruppe = store.get(GRUPPE_KEY) || "faellig";
let aufgabenSuche = "";
let quickDraft = "";

function todoRow(t, show = { kunde: true, wer: true }) {
  const late = t.faellig && !t.erledigt && t.faellig < todayStr();
  const meta = [
    show.kunde && hatKunde(t) ? esc(kundeLabel(t)) : "",
    show.wer && t.wer.trim() ? `<span class="who">→ ${esc(t.wer)}</span>` : "",
    t.faellig ? `<span class="${late ? "late" : ""}">${late ? "überfällig · " : "bis "}${esc(fmtDate(t.faellig))}</span>` : "",
    t.rueckmeldung && !t.erledigt ? (t.geklaert ? "Kunde informieren" : "Rückmeldung an Kunden") : "",
    wartet(t) && t.angefragtAm ? `<span class="${stale(t) ? "stale" : ""}">${fmtSince(t.angefragtAm)}</span>` : "",
  ].filter(Boolean).join(" · ");
  const half = !t.erledigt && t.rueckmeldung && t.geklaert;
  const askBtn = show.ask && wartet(t) && (!t.angefragtAm || stale(t))
    ? `<button class="btn small ask" data-ask="${t.id}">${t.angefragtAm ? "Nachgehakt" : "Angefragt"}</button>` : "";
  return `<div class="row ${t.erledigt ? "done" : ""}">
    <input type="checkbox" class="check ${half ? "half" : ""}" data-toggle="${t.id}" ${t.erledigt ? "checked" : ""}

// Gruppen mit leerem Schlüssel (z. B. „Ohne Kunde“) stehen am Ende
function groupBy(list, labelFn, keyFn = x => lc(labelFn(x))) {
  const m = new Map();
  for (const x of list) { const key = keyFn(x); if (!m.has(key)) m.set(key, { name: labelFn(x), key, items: [] }); m.get(key).items.push(x); }
  return [...m.values()].sort((a, b) => (!a.key - !b.key) || a.name.localeCompare(b.name, "de", { numeric: true }));
}

const WOCHENTAGE = { sonntag: 0, montag: 1, dienstag: 2, mittwoch: 3, donnerstag: 4, freitag: 5, samstag: 6 };
const WT_KURZ = { so: 0, mo: 1, di: 2, mi: 3, do: 4, fr: 5, sa: 6 };
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const inTagen = n => { const d = new Date(); d.setDate(d.getDate() + n); return dateStr(d); };
const naechsterWochentag = wd => inTagen(((wd - new Date().getDay() + 7) % 7) || 7);
const naechsteWoche = () => inTagen(((8 - new Date().getDay()) % 7) || 7); // Montag der nächsten Woche
function datumAus(d, mo, y) {
  d = +d; mo = +mo;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return "";
  const heute = new Date();
  let yy = y ? (y.length === 2 ? 2000 + +y : +y) : heute.getFullYear();
  let s = `${yy}-${pad(mo)}-${pad(d)}`;
  if (!y && s < todayStr()) s = `${yy + 1}-${pad(mo)}-${pad(d)}`; // „12.1.“ im Dezember = nächstes Jahr
  return s;
}
const END = "(?=[\\s,;!]|$)";
function parseQuick(raw) {
  let s = " " + String(raw || "") + " ";
  const r = { text: "", faellig: "", wer: "", kundeNr: "", kunde: "", wichtig: false };
  const cut = (re, fn) => { const m = s.match(re); if (!m) return false; const ok = fn(m); if (ok === false) return false;
    s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length); return true; };

  // ! = wichtig (allein stehend oder am Ende)
  if (cut(/(^|\s)!+(?=\s|$)/, () => r.wichtig = true) || /\S!+\s*$/.test(s)) { r.wichtig = true; s = s.replace(/!+(\s*)$/, "$1"); }
  // #Kundennr.
  cut(/(^|\s)#([^\s#,;]+)/, m => { r.kundeNr = m[2].replace(/[.:]+$/, ""); r.kunde = kundeByNr(r.kundeNr)?.name || ""; });
  // @Wer – bekannte Namen (auch mit Leerzeichen) zuerst, längster Treffer gewinnt
  const bekannt = [...new Set(db.todos.map(x => x.wer.trim()).filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!bekannt.some(w => cut(new RegExp(`(^|\\s)@${reEsc(w)}${END}`, "i"), () => r.wer = w)))
    cut(/(^|\s)@([^\s@]+)/, m => r.wer = m[2].replace(/[.,;:]+$/, ""));
  // Fälligkeit – nur der erste Treffer zählt
  const vor = "(^|\\s)((?:bis|am|ab)\\s+)?";
  const datum = [
    [new RegExp(`${vor}übermorgen${END}`, "i"), () => inTagen(2)],
    [new RegExp(`${vor}heute${END}`, "i"), () => inTagen(0)],
    [new RegExp(`${vor}morgen${END}`, "i"), () => inTagen(1)],
    [new RegExp(`${vor}(nächste|nächster|naechste|naechster|kommende)\\s+woche${END}`, "i"), () => naechsteWoche()],
    [new RegExp(`${vor}(${Object.keys(WOCHENTAGE).join("|")})${END}`, "i"), m => naechsterWochentag(WOCHENTAGE[m[3].toLowerCase()])],
    // Kurzformen nur nach „bis“/„am“ – „Fr. Müller“ und „so schnell wie möglich“ bleiben Text
    [new RegExp(`(^|\\s)(bis|am|ab)\\s+(${Object.keys(WT_KURZ).join("|")})\\.?${END}`, "i"), m => naechsterWochentag(WT_KURZ[m[3].toLowerCase()])],
    [new RegExp(`${vor}(\\d{1,2})\\.(\\d{1,2})\\.(\\d{4}|\\d{2})?${END}`, "i"), m => datumAus(m[3], m[4], m[5])],
  ];
  for (const [re, fn] of datum) if (cut(re, m => { const d = fn(m); if (!d) return false; r.faellig = d; })) break;

  r.text = s.replace(/\s+/g, " ").trim().replace(/^[-–,;:]\s*|\s*[-–,;:]$/g, "").trim();
  return r;
}

    <button class="totodo ${isTodo ? "is-todo" : ""}" data-totodo="${n.id}">${isTodo ? "✓ Aufgabe" : "→ Aufgabe"}</button></div>`;
}
function wireNotes(box, t) {
  const idx = el => t.notizen.findIndex(n => n.id === el.closest(".note").dataset.note);
  box.addEventListener("input", e => {
    const i = idx(e.target); t.notizen[i].text = e.target.value; save();
    e.target.closest(".note").classList.toggle("is-h", isHeading(e.target.value));
  });
  box.addEventListener("keydown", e => {
    if (e.target.tagName !== "INPUT") return;
    const i = idx(e.target);
    if (e.key === "Enter") {
      e.preventDefault();
      const n = { id: uid(), text: "" };
      t.notizen.splice(i + 1, 0, n); save();
      e.target.closest(".note").insertAdjacentHTML("afterend", noteRow(n));
      box.querySelector(`[data-note="${n.id}"] input`).focus();
    } else if (e.key === "Backspace" && e.target.value === "" && t.notizen.length > 1) {
      e.preventDefault();
      const prev = e.target.closest(".note").previousElementSibling || e.target.closest(".note").nextElementSibling;
      t.notizen.splice(i, 1); save();
      e.target.closest(".note").remove();
      const pi = prev.querySelector("input"); pi.focus(); pi.setSelectionRange(pi.value.length, pi.value.length);
    }
  });
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-totodo]"); if (!b) return;
    const n = t.notizen.find(x => x.id === b.dataset.totodo);
    if (n.todoId && todo(n.todoId)) { todoSheet(todo(n.todoId)); return; }
    if (!n.text.trim()) { toast("Erst Stichpunkt eintippen"); return; }
    const td = newTodo({ text: n.text.trim(), terminId: t.id });
    db.todos.push(td); n.todoId = td.id; save();
    toast("Als Aufgabe übernommen – antippen für „Wer“ & Rückmeldung"); route();
  });
}

function berichtText(t) {
  const L = [`Besuchsbericht: ${t.kunde}`, ""];
  if (t.kundeNr) L.push(`Kundennr.: ${t.kundeNr}`);
  L.push(`Datum: ${fmtRange(t.datum, t.ende)}`);
  if (t.ort) L.push(`Ort: ${t.ort}`);
  if (t.teilnehmer) L.push(`Teilnehmer: ${t.teilnehmer}`);
  const sections = noteSections(t);
  const withTitles = sections.filter(s => s.title);
  if (sections.length) {
    L.push("", withTitles.length ? "Besprochene Themen" : "Gesprächsinhalte");
    let nr = 0;
    for (const s of sections) {
      L.push("");
      if (s.title) L.push(`${++nr}. ${s.title}`);
      else if (withTitles.length) L.push("Allgemein");
      s.items.forEach(i => L.push(`- ${i}`));
    }
  }
  const todos = db.todos.filter(x => x.terminId === t.id).sort((a, b) => a.erstellt - b.erstellt);
  if (todos.length) {
    L.push("", "Vereinbarte Maßnahmen", "");
    for (const x of todos) {
      L.push(`- ${x.text} – Zuständig: ${x.wer.trim() || meName()}${x.faellig ? `, bis ${parseLocal(x.faellig).toLocaleDateString("de-DE")}` : ""}${x.erledigt ? " (erledigt)" : ""}`);
      if (x.ergebnis.trim()) L.push(`  Ergebnis: ${x.ergebnis.trim().replace(/\n/g, "\n  ")}`);
    }
  }
  return L.join("\n") + "\n";
}
function berichtSheet(t) {
  const form = openSheet(`

    <div class="btnrow"><button type="button" class="btn" data-copy>Kopieren</button></div>

/* ---------- Outlook-Einladung lesen ---------- */
const MONATE = { jan: 1, januar: 1, january: 1, feb: 2, februar: 2, february: 2, mär: 3, mrz: 3, märz: 3, maerz: 3, mar: 3, march: 3,
  apr: 4, april: 4, mai: 5, may: 5, jun: 6, juni: 6, june: 6, jul: 7, juli: 7, july: 7, aug: 8, august: 8,
  sep: 9, sept: 9, september: 9, okt: 10, oct: 10, oktober: 10, october: 10, nov: 11, november: 11, dez: 12, dec: 12, dezember: 12, december: 12 };
const PREFIX = /^\s*((WG|FW|FWD|AW|RE|Einladung|Invitation|Aktualisiert|Updated|Updated invitation|Akzeptiert|Accepted)\s*:\s*)+/i;
function parseInvite(raw) {
  const text = String(raw || "").replace(/\r\n?/g, "\n");
  if (/BEGIN:VCALENDAR|BEGIN:VEVENT/.test(text)) return parseIcs(text);
  const r = {};
  const line = re => { const m = text.match(re); return m ? m[m.length - 1].trim() : ""; };
  r.kunde = line(/^\s*(Betreff|Subject|Titel|Title)\s*:\s*(.+)$/im);
  r.ort = line(/^\s*(Wo|Ort|Where|Location|Raum)\s*:\s*(.+)$/im);
  // Nur echte Teilnehmerzeilen – „An:“ einer weitergeleiteten Mail wärst meist du selbst
  const tn = [...text.matchAll(/^\s*(Erforderlich|Optional|Required|Teilnehmer|Attendees)\s*:\s*(.+)$/gim)].map(m => m[2]).join(";");
  if (tn) r.teilnehmer = cleanNames(tn.split(/[;\n]/));
  // Datum/Zeit: zuerst in „Wann:“-Zeile suchen, sonst im Text ohne Sendedatum-Zeilen
  const whenLine = line(/^\s*(Wann|When)\s*:\s*(.+)$/im) || line(/^\s*(Beginn|Start|Zeit|Time)\s*:\s*(.+)$/im);
  const body = whenLine || text.split("\n").filter(l => !/^\s*(Gesendet|Sent|Von|From|Datum|Date)\s*:/i.test(l)).join("\n");
  const dt = findDateTime(body);
  if (dt) Object.assign(r, dt);
  if (!r.kunde) {
    const first = text.split("\n").map(s => s.trim()).find(s => s && !/:\s/.test(s.slice(0, 20)) && !findDateTime(s));
    if (first) r.kunde = first;
  }
  if (r.kunde) r.kunde = r.kunde.replace(PREFIX, "").trim();
  return r;
}
function findDateTime(s) {
  s = s.replace(/\((UTC|GMT)[^)]*\)/gi, " ");
  const cands = [];
  let m;
  if ((m = /(\d{1,2})\.\s*([A-Za-zÄäÖöÜü]{3,9})\.?\s+(\d{4})/.exec(s)) && MONATE[m[2].toLowerCase()])
    cands.push({ i: m.index, len: m[0].length, y: +m[3], mo: MONATE[m[2].toLowerCase()], d: +m[1] });
  if ((m = /\b([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/.exec(s)) && MONATE[m[1].toLowerCase()])
    cands.push({ i: m.index, len: m[0].length, y: +m[3], mo: MONATE[m[1].toLowerCase()], d: +m[2] });
  if ((m = /\b(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})\b/.exec(s)))
    cands.push({ i: m.index, len: m[0].length, y: m[3].length === 2 ? 2000 + +m[3] : +m[3], mo: +m[2], d: +m[1] });
  if ((m = /\b(\d{4})-(\d{2})-(\d{2})/.exec(s)))
    cands.push({ i: m.index, len: m[0].length, y: +m[1], mo: +m[2], d: +m[3] });
  if (!cands.length) return null;
  const c = cands.sort((a, b) => a.i - b.i)[0];
  if (c.mo < 1 || c.mo > 12 || c.d < 1 || c.d > 31) return null;
  const rest = s.slice(c.i + c.len);
  const times = [...rest.matchAll(/(\d{1,2})[:.](\d{2})(?!\.\d)\s*(a\.?m\.?|p\.?m\.?)?/gi)].slice(0, 2).map(t => {
    let h = +t[1]; const ap = (t[3] || "").toLowerCase().replace(/\./g, "");
    if (ap === "pm" && h < 12) h += 12; if (ap === "am" && h === 12) h = 0;
    return h <= 23 && +t[2] <= 59 ? `${pad(h)}:${t[2]}` : null;
  }).filter(Boolean);
  const day = `${c.y}-${pad(c.mo)}-${pad(c.d)}`;
  const datum = `${day}T${times[0] || "09:00"}`;
  let ende = times[1] ? `${day}T${times[1]}` : addHours(datum, 3);
  if (ende <= datum) ende = addHours(datum, 3);
  return { datum, ende, ohneZeit: !times.length };
}
function cleanNames(parts) {
  const seen = new Set();
  const me = (db.einstellungen.name || "").trim().toLowerCase();
  if (me) seen.add(me);
  return parts.map(p => p.replace(/<[^>]*>/g, "").replace(/\S+@\S+/g, "").replace(/["']/g, "").trim())
    .filter(p => p && !seen.has(p.toLowerCase()) && seen.add(p.toLowerCase())).join("; ");
}
function parseIcs(text) {
  const t = text.replace(/\n[ \t]/g, "");
  const ev = (t.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/) || [t])[0];
  const prop = name => { const m = ev.match(new RegExp(`^${name}(;[^:\\n]*)?:(.*)$`, "m")); return m ? unescIcs(m[2].trim()) : ""; };
  const dt = name => {
    const m = ev.match(new RegExp(`^${name}(;[^:\\n]*)?:(\\d{8})(T(\\d{4})(\\d{2})?(Z)?)?`, "m"));
    if (!m) return "";
    const y = +m[2].slice(0, 4), mo = +m[2].slice(4, 6), d = +m[2].slice(6, 8);
    if (!m[4]) return `${y}-${pad(mo)}-${pad(d)}T09:00`;
    const h = +m[4].slice(0, 2), mi = +m[4].slice(2, 4);
    return m[6] ? localStr(new Date(Date.UTC(y, mo - 1, d, h, mi))) : `${y}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}`;
  };
  const names = [...ev.matchAll(/^ATTENDEE[^\n]*?CN=("?)([^";:\n]+)\1/gm)].map(m => m[2]);
  const r = { kunde: prop("SUMMARY").replace(PREFIX, "").trim(), ort: prop("LOCATION"), datum: dt("DTSTART"), ende: dt("DTEND"), teilnehmer: cleanNames(names) };
  if (r.datum && (!r.ende || r.ende <= r.datum)) r.ende = addHours(r.datum, 3);
  return r;
}
const unescIcs = s => s.replace(/\\n/gi, "\n").replace(/\\([,;\\])/g, "$1");

// Gibt true zurück, wenn geteilt oder kopiert wurde (false bei Abbruch/Fehler)
async function shareText(title, text) {
  if (navigator.share) {
    try { await navigator.share({ title, text }); return true; } catch (e) { if (e.name === "AbortError") return false; }
  }
  try { await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); return true; }
  catch (e) { toast("Teilen nicht möglich"); return false; }
}
async function shareFile(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
const slug = s => s.replace(/[^\wäöüÄÖÜß-]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "Termin";
function ics(t) {
  const e = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const f = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const start = parseLocal(t.datum), end = parseLocal(t.ende) || new Date(start.getTime() + 3 * 36e5);
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const desc = [t.teilnehmer ? "Teilnehmer: " + t.teilnehmer : "", ...t.notizen.filter(n => n.text.trim()).map(n => "• " + n.text.trim())].filter(Boolean).join("\n");
  // Zeilen nach max. 73 Byte (UTF-8) falten, ohne Zeichen zu zerteilen
  const enc = new TextEncoder();
  const fold = line => { let out = "", cur = "", n = 0;
    for (const ch of line) { const b = enc.encode(ch).length;
      if (n + b > 73) { out += cur + "\r\n "; cur = ""; n = 1; }
      cur += ch; n += b; }
    return out + cur; };
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Kundentermine//DE", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${t.id}@kundentermine`, `DTSTAMP:${now}`, `DTSTART:${f(start)}`, `DTEND:${f(end)}`,
    `SUMMARY:${e("Kundentermin: " + t.kunde)}`, t.ort ? `LOCATION:${e(t.ort)}` : "",
    desc ? `DESCRIPTION:${e(desc)}` : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).map(fold).join("\r\n") + "\r\n";
}

  sheet.innerHTML = `<form class="sheet" method="dialog">${html}</form>`;
  const form = sheet.querySelector("form");
  form.querySelector("[data-cancel]").onclick = () => sheet.close();
  form.onsubmit = e => { e.preventDefault(); if (onSave(form) !== false) sheet.close(); };
  sheet.showModal();
  sheet.scrollTop = 0;
  return form;
}
function terminSheet(t) {
  const form = openSheet(`
    <div class="sheet-head"><button type="button" data-cancel>Abbrechen</button><strong>${t ? "Termin bearbeiten" : "Neuer Termin"}</strong><button class="save">Sichern</button></div>
    ${t ? "" : `<details class="invite" open><summary>Aus Outlook-Einladung übernehmen</summary>
      <textarea class="field" name="invite" rows="3" placeholder="Einladungstext hier einfügen (Betreff, Wann, Wo …)"></textarea>
      <div class="btnrow"><button type="button" class="btn small" data-paste>Aus Zwischenablage</button><button type="button" class="btn small" data-icsfile>.ics-Datei wählen</button></div>
    </details>`}
    <label class="lbl">Kunde / Betreff<input class="field" name="kunde" required value="${esc(t?.kunde)}" autocomplete="off" autocapitalize="words"></label>
    <label class="lbl">Kundennr. (optional)<input class="field" name="kundeNr" list="nrList" value="${esc(t?.kundeNr)}" autocomplete="off" autocapitalize="characters"></label>
    <datalist id="nrList">${kundenOptions()}</datalist>
    <label class="lbl">Beginn<input class="field" name="datum" type="datetime-local" required value="${esc(t?.datum || nowLocal())}"></label>
    <label class="lbl">Ende<input class="field" name="ende" type="datetime-local" required value="${esc(t?.ende || addHours(nowLocal(), 3))}"></label>
    <label class="lbl">Ort (optional)<input class="field" name="ort" value="${esc(t?.ort)}" autocomplete="off"></label>
    <label class="lbl">Teilnehmer (optional)<input class="field" name="teilnehmer" value="${esc(t?.teilnehmer)}" placeholder="z. B. Hr. Schulz (GF); Fr. Lee (IT)" autocomplete="off"></label>`,
    f => {
      const v = { kunde: f.kunde.value.trim(), kundeNr: f.kundeNr.value.trim(), datum: f.datum.value, ende: f.ende.value, ort: f.ort.value.trim(), teilnehmer: f.teilnehmer.value.trim() };
      if (!v.kunde || !v.datum) return false;
      // Bewusst kein merkeKunde(): „Kunde / Betreff“ ist oft der Outlook-Betreff, kein Kundenname
      if (!v.ende || v.ende <= v.datum) v.ende = addHours(v.datum, 3);
      if (t) { Object.assign(t, v); save(); route(); }
      else { const n = { id: uid(), ...v, notizen: [{ id: uid(), text: "" }], berichtErledigt: false, erstellt: Date.now() };
        if (db.einstellungen.vorlageAuto) insertVorlage(n);
        db.termine.push(n); save(); location.hash = `#/termin/${n.id}`;
        setTimeout(() => document.querySelector("#notes .note:not(.is-h) input")?.focus(), 50); }
    });
  // Ende folgt dem Beginn (+3 h), solange es nicht von Hand geändert wurde
  let endTouched = !!t;
  form.ende.addEventListener("input", () => endTouched = true);
  form.datum.addEventListener("input", () => { if (!endTouched) form.ende.value = addHours(form.datum.value, 3); });
  form.kundeNr.addEventListener("change", () => {
    const k = kundeByNr(form.kundeNr.value);
    if (k?.name && !form.kunde.value.trim()) form.kunde.value = k.name;
  });
  if (t) return;
  const apply = raw => {
    const r = parseInvite(raw);
    if (!r.datum && !r.kunde) { toast("In dem Text wurde kein Termin erkannt"); return; }
    if (r.kunde) form.kunde.value = r.kunde;
    if (r.datum) { form.datum.value = r.datum; form.ende.value = r.ende; endTouched = true; }
    if (r.ort) form.ort.value = r.ort;
    if (r.teilnehmer) form.teilnehmer.value = r.teilnehmer;
    form.querySelector("details").open = false;
    toast(r.datum ? (r.ohneZeit ? "Übernommen – Uhrzeit bitte prüfen" : "Übernommen – bitte kurz prüfen") : "Datum nicht erkannt – bitte eintragen");
  };
  form.invite.addEventListener("paste", () => setTimeout(() => apply(form.invite.value), 0));
  form.invite.addEventListener("change", () => apply(form.invite.value));
  form.querySelector("[data-paste]").onclick = async () => {
    try { const txt = await navigator.clipboard.readText(); form.invite.value = txt; apply(txt); }
    catch (e) { form.invite.focus(); toast("Bitte lange ins Feld tippen → Einsetzen"); }
  };
  const icsInput = document.getElementById("icsFile");
  form.querySelector("[data-icsfile]").onclick = () => {
    icsInput.onchange = async () => { const f = icsInput.files[0]; icsInput.value = ""; if (f) apply(await f.text()); };
    icsInput.click();
  };
}
function todoSheet(t, terminId) {
  const tm = termin(t?.terminId || terminId);
  const werList = [...new Set(db.todos.map(x => x.wer.trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
  // Bei Aufgaben aus einem Termin: Termin-Kunde als Platzhalter – leer lassen = übernehmen
  const erbt = tm ? { nr: (tm.kundeNr || "").trim(), name: kundeByNr(tm.kundeNr)?.name || tm.kunde || "" } : null;
  const form = openSheet(`
    <div class="sheet-head"><button type="button" data-cancel>Abbrechen</button><strong>${t ? "Aufgabe" : "Neue Aufgabe"}</strong><button class="save">Sichern</button></div>
    <label class="lbl">Was ist zu tun?<textarea class="field" name="text" required rows="2">${esc(t?.text)}</textarea></label>
    <div class="two">
      <label class="lbl">Kundennr.<input class="field" name="kundeNr" list="nrList" value="${esc(t?.kundeNr)}" placeholder="${esc(erbt?.nr || "optional")}" autocomplete="off" autocapitalize="characters"></label>
      <label class="lbl">Kunde<input class="field" name="kunde" list="kundeList" value="${esc(t?.kunde)}" placeholder="${esc(erbt?.name || "optional")}" autocomplete="off" autocapitalize="words"></label>
    </div>
    <datalist id="nrList">${kundenOptions()}</datalist>
    <datalist id="kundeList">${kundenNamenOptions()}</datalist>
    <div class="two">
      <label class="lbl">Wer / Abteilung<input class="field" name="wer" list="werList" value="${esc(t?.wer)}" placeholder="leer = ich" autocomplete="off" autocapitalize="words"></label>
      <label class="lbl">Fällig am<input class="field" name="faellig" type="date" value="${esc(t?.faellig)}"></label>
    </div>
    <div class="quickdates"><button type="button" class="btn small" data-due="0">Heute</button><button type="button" class="btn small" data-due="1">Morgen</button>
      <button type="button" class="btn small" data-due="w">Nächste Woche</button><button type="button" class="btn small" data-due="" aria-label="Kein Datum">✕</button></div>
    <datalist id="werList">${werList.map(w => `<option value="${esc(w)}">`).join("")}</datalist>
    <label class="chk"><input type="checkbox" class="check" name="wichtig" ${t?.wichtig ? "checked" : ""}><span>★ Wichtig</span></label>
    <label class="lbl" data-angefragt style="${t?.wer?.trim() ? "" : "display:none"}">Zuletzt angefragt / nachgehakt am
      <div class="btnrow"><input class="field" name="angefragtAm" type="date" value="${esc(t?.angefragtAm)}" style="flex:1">
      <button type="button" class="btn small fit" data-heute>Heute</button></div></label>
    <label class="chk"><input type="checkbox" class="check" name="rueckmeldung" ${t?.rueckmeldung ? "checked" : ""}>
      <span>Rückmeldung an Kunden nötig</span></label>
    <label class="chk" data-geklaert style="${t?.rueckmeldung ? "" : "display:none"}"><input type="checkbox" class="check" name="geklaert" ${t?.geklaert ? "checked" : ""}>
      <span>Geklärt – Kunde muss noch informiert werden</span></label>
    <label class="lbl">Ergebnis / Antwort<textarea class="field" name="ergebnis" rows="2" placeholder="Was hast du in Erfahrung gebracht?">${esc(t?.ergebnis)}</textarea></label>
    ${tm ? `<button type="button" class="linkrow" data-goto>Termin: ${esc(tm.kunde)} · ${esc(fmtDate(tm.datum.slice(0, 10)))} ›</button>` : ""}
    ${t ? `<button type="button" class="btn danger" data-del>Aufgabe löschen</button>` : ""}`,
    f => {
      let kundeNr = f.kundeNr.value.trim(), kunde = f.kunde.value.trim();
      const perName = !kundeNr && kundeByName(kunde);
      // bekannter Name → Nr. aus dem Stamm; neues Paar merken. Der Name kommt dann live aus dem Kundenstamm
      if (perName) { kundeNr = perName.nr; kunde = ""; }
      else if (kundeNr && kunde) { merkeKunde(kundeNr, kunde); kunde = ""; }
      else if (kundeNr && kundeByNr(kundeNr)) kunde = "";
      const v = { text: f.text.value.trim(), wer: f.wer.value.trim(), faellig: f.faellig.value, ergebnis: f.ergebnis.value.trim(),
                  kundeNr, kunde, wichtig: f.wichtig.checked,
                  rueckmeldung: f.rueckmeldung.checked, geklaert: f.rueckmeldung.checked && f.geklaert.checked,
                  angefragtAm: f.wer.value.trim() ? f.angefragtAm.value : "" };
      if (!v.text) return false;
      if (t) Object.assign(t, v);
      else db.todos.push(newTodo({ ...v, terminId: terminId || null }));
      save(); route();
    });
  // Kundennr. ↔ Name gegenseitig ergänzen
  let nameAuto = false;
  form.kundeNr.addEventListener("change", () => {
    const k = kundeByNr(form.kundeNr.value);
    if (k?.name && (!form.kunde.value.trim() || nameAuto)) { form.kunde.value = k.name; nameAuto = true; }
  });
  form.kunde.addEventListener("input", () => nameAuto = false);
  form.kunde.addEventListener("change", () => {
    const k = kundeByName(form.kunde.value);
    if (k && !form.kundeNr.value.trim()) form.kundeNr.value = k.nr;
  });
  form.querySelectorAll("[data-due]").forEach(b => b.onclick = () => {
    const d = b.dataset.due;
    form.faellig.value = d === "" ? "" : d === "w" ? naechsteWoche() : inTagen(+d);
  });
  form.rueckmeldung.onchange = () => form.querySelector("[data-geklaert]").style.display = form.rueckmeldung.checked ? "" : "none";
  form.wer.addEventListener("input", () => form.querySelector("[data-angefragt]").style.display = form.wer.value.trim() ? "" : "none");
  form.querySelector("[data-heute]").onclick = () => form.angefragtAm.value = todayStr();
  form.querySelector("[data-goto]")?.addEventListener("click", () => { sheet.close(); location.hash = `#/termin/${tm.id}`; });
  form.querySelector("[data-del]")?.addEventListener("click", () => {
    if (!confirm("Aufgabe löschen?")) return;
    db.todos = db.todos.filter(x => x.id !== t.id);
    db.termine.forEach(tt => tt.notizen.forEach(n => { if (n.todoId === t.id) n.todoId = null; }));
    save(); sheet.close(); route(); toast("Aufgabe gelöscht");
  });
  if (!t) form.text.focus();
}

/* ---------- Globale Klicks ---------- */
document.getElementById("app").addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { location.hash = `#/termin/${open.dataset.open}`; return; }
  const ask = e.target.closest("[data-ask]");
  if (ask) { const t = todo(ask.dataset.ask); const again = !!t.angefragtAm; t.angefragtAm = todayStr(); save(); route();
    toast(again ? "Nachgehakt – Frist läuft neu" : "Als angefragt markiert"); return; }
  const star = e.target.closest("[data-star]");
  if (star) { const t = todo(star.dataset.star); t.wichtig = !t.wichtig; save(); route(); return; }
  const ed = e.target.closest("[data-edit-todo]");
  if (ed) { todoSheet(todo(ed.dataset.editTodo)); return; }
});
document.getElementById("app").addEventListener("change", e => {
  const id = e.target.dataset.toggle; if (!id) return;
  const t = todo(id);
  if (e.target.checked && t.rueckmeldung && !t.geklaert) {
    t.geklaert = true;
    toast("Geklärt – jetzt unter „Rückmeldung“");
  } else {
    t.erledigt = e.target.checked; t.erledigtAm = t.erledigt ? Date.now() : null;
    if (t.erledigt) toast(t.rueckmeldung ? "Kunde informiert ✓" : "Erledigt ✓");
  }
  save();
  setTimeout(route, e.target.checked ? 350 : 0);
});

/* Daten aus anderem Tab/Fenster übernehmen */
window.addEventListener("storage", e => { if (e.key === KEY) { db = load(); route(); } });

db = load();
route();
</script>
